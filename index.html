<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- GOOGLE SITE VERIFICATION -->
  <meta name="google-site-verification" content="letmCdiLn_MqCbGxy1eyQw1y0GfCWAhQ1H4WA7sw4_8" />

  <!-- SEO & OPEN GRAPH METADATA -->
  <title>Wantedle – Daily Case Guessing Game</title>
  <meta name="title" content="Wantedle – Daily Case Guessing Game" />
  <meta name="description" content="Test your deduction skills in Wantedle! Analyze mugshots and progressive evidence clues to guess the daily case subject." />
  <meta name="keywords" content="wantedle, wantedle game, daily wordle games, crime guessing game, fbi wanted game, daily puzzle" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wantedle – Daily Case Guessing Game" />
  <meta property="og:description" content="Can you identify today's subject using progressive clues and evidence?" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stats-bar span {
      color: var(--accent-color);
      font-weight: bold;
    }

    .game-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .image-box {
      width: 100%;
      height: 260px;
      background-color: #020617;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: filter 0.5s ease;
    }

    .clues-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .clue-item {
      background-color: #020617;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .clue-item.revealed {
      color: var(--text-main);
      border-color: var(--accent-color);
    }

    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #020617;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    .attempts-tracker {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .status-message.success { color: var(--success); }
    .status-message.error { color: var(--danger); }

    .share-btn {
      display: none;
      width: 100%;
      margin-top: 15px;
      background-color: var(--success);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>WANTEDLE</h1>
    <p class="subtitle">Daily Case Deduction Game</p>
    <div class="stats-bar">
      <div>Streak: <span id="streak-val">0</span></div>
      <div>Played: <span id="played-val">0</span></div>
    </div>
  </header>

  <main class="game-container">
    <div class="image-box">
      <img id="subject-img" src="" alt="Case Subject Image" style="filter: blur(20px);" />
    </div>

    <div class="clues-list" id="clues-container">
      <div class="clue-item" id="clue-1">Clue 1: Attempt a guess or reveal...</div>
      <div class="clue-item" id="clue-2">Clue 2: Locked</div>
      <div class="clue-item" id="clue-3">Clue 3: Locked</div>
    </div>

    <div class="input-section" id="controls">
      <input type="text" id="guess-input" placeholder="Enter name or subject..." autocomplete="off" />
      <button id="submit-btn" onclick="makeGuess()">Guess</button>
    </div>

    <div class="attempts-tracker" id="attempts">Attempts: 0 / 5</div>
    <div class="status-message" id="status"></div>
    <button id="share-btn" class="share-btn" onclick="shareResult()">Share Score 📋</button>
  </main>

  <script>
    let currentSubject = null;
    let attempts = 0;
    const maxAttempts = 5;
    const blurLevels = [25, 18, 12, 6, 2, 0];

    // Strip giveaway terms dynamically
    function sanitizeClueText(text) {
      if (!text) return "Information withheld for active investigation.";
      return text
        .replace(/violent\s*crimes?/gi, "Subject Profile")
        .replace(/crimes?/gi, "Incident")
        .replace(/fugitive/gi, "Individual")
        .replace(/wanted/gi, "Under Review")
        .replace(/bank\s*robbery/gi, "Financial Inquiry")
        .replace(/terrorism/gi, "Special Interest")
        .replace(/kidnapping/gi, "Location Inquiry")
        .replace(/murder/gi, "Critical Inquiry")
        .replace(/homicide/gi, "Major Incident");
    }

    // Load Local Storage Stats
    function loadStats() {
      const streak = localStorage.getItem('wantedle_streak') || 0;
      const played = localStorage.getItem('wantedle_played') || 0;
      document.getElementById('streak-val').innerText = streak;
      document.getElementById('played-val').innerText = played;
    }

    function updateStats(won) {
      let streak = parseInt(localStorage.getItem('wantedle_streak') || 0);
      let played = parseInt(localStorage.getItem('wantedle_played') || 0);
      
      played++;
      streak = won ? streak + 1 : 0;

      localStorage.setItem('wantedle_streak', streak);
      localStorage.setItem('wantedle_played', played);
      
      document.getElementById('streak-val').innerText = streak;
      document.getElementById('played-val').innerText = played;
    }

    async function initGame() {
      loadStats();
      try {
        const response = await fetch('https://api.fbi.gov/wanted/v1/list?page=1');
        const data = await response.json();
        
        // Filter out items without valid title or image
        const validItems = data.items.filter(item => item.images && item.images.length > 0 && item.title);
        
        // Pick daily deterministic item based on date
        const today = new Date().toISOString().slice(0, 10);
        let hash = 0;
        for (let i = 0; i < today.length; i++) {
          hash = today.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % validItems.length;
        
        currentSubject = validItems[index];

        // Setup Image
        const imgElement = document.getElementById('subject-img');
        imgElement.src = currentSubject.images[0].original || currentSubject.images[0].large;
        imgElement.style.filter = `blur(${blurLevels[0]}px)`;

        // Setup Initial Neutral Clues
        document.getElementById('clue-1').innerText = `Field Office: ${currentSubject.field_offices ? currentSubject.field_offices.join(', ') : 'Central Division'}`;
        document.getElementById('clue-2').innerText = `Profile Note: ${sanitizeClueText(currentSubject.description || currentSubject.subjects?.[0])}`;
        document.getElementById('clue-3').innerText = `Status / Details: ${sanitizeClueText(currentSubject.caution || currentSubject.details || 'Active File')}`;

      } catch (err) {
        console.error("Failed to load subject data", err);
        document.getElementById('status').innerText = "Failed to load case data. Please refresh.";
      }
    }

    function makeGuess() {
      const input = document.getElementById('guess-input');
      const userGuess = input.value.trim().toLowerCase();
      const status = document.getElementById('status');

      if (!userGuess || !currentSubject) return;

      attempts++;
      document.getElementById('attempts').innerText = `Attempts: ${attempts} / ${maxAttempts}`;

      // Progressive Blur Reduction
      const imgElement = document.getElementById('subject-img');
      imgElement.style.filter = `blur(${blurLevels[Math.min(attempts, blurLevels.length - 1)]}px)`;

      const targetTitle = currentSubject.title.toLowerCase();

      if (targetTitle.includes(userGuess) || userGuess.includes(targetTitle)) {
        status.className = "status-message success";
        status.innerText = `Correct! Subject identified: ${currentSubject.title}`;
        imgElement.style.filter = 'blur(0px)';
        updateStats(true);
        endGame();
      } else {
        if (attempts >= maxAttempts) {
          status.className = "status-message error";
          status.innerText = `Case Unsolved. Subject was: ${currentSubject.title}`;
          imgElement.style.filter = 'blur(0px)';
          updateStats(false);
          endGame();
        } else {
          status.className = "status-message error";
          status.innerText = "Incorrect. Clues updated & image sharpened!";
        }
      }

      input.value = '';
    }

    function endGame() {
      document.getElementById('guess-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('share-btn').style.display = 'block';
    }

    function shareResult() {
      const text = `Wantedle Score: ${attempts}/${maxAttempts}\nTry today's case at: ${window.location.href}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("Result copied to clipboard!");
      });
    }

    // Launch game on load
    window.onload = initGame;
  </script>
</body>
</html>
