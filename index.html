<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTEDLE — FBI Criminal Case Files</title>
  
  <meta name="description" content="Identify active FBI fugitives based on crime categories and case files.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800;900&display=swap');

    :root {
      --bg: #0b0c0e;
      --panel-bg: #121418;
      --panel-border: #262930;
      --accent-red: #d32f2f;
      --accent-gold: #c5a059;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --correct: #2e7d32;
      --wrong: #c62828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px;
      background-image: radial-gradient(#1a1d24 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Top Bar */
    header {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      max-width: 520px;
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 16px;
    }

    .badge-classified {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-gold);
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid var(--accent-gold);
      padding: 3px 8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
      text-transform: uppercase;
    }

    h1 span { color: var(--accent-red); }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* Main Card */
    .game-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .game-card::before {
      content: 'CONFIDENTIAL // FBI FUGITIVE DIVISION';
      position: absolute;
      top: -10px;
      left: 16px;
      background: var(--bg);
      padding: 0 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }

    /* Home Buttons */
    .home-menu { gap: 14px; }
    
    .btn-mode {
      background: #181b22;
      border: 1px solid var(--panel-border);
      padding: 18px;
      border-radius: 6px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-mode:hover {
      border-color: var(--accent-gold);
      background: #1f232c;
      transform: translateY(-2px);
    }

    .btn-mode.primary {
      border-color: var(--accent-red);
      background: rgba(211, 47, 47, 0.1);
    }

    .btn-mode.primary:hover {
      background: rgba(211, 47, 47, 0.2);
    }

    .btn-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Game Navigation Header */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--panel-border);
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 6px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-back:hover { color: #fff; border-color: #fff; }

    .mode-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-red);
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Image Display Frame */
    .mugshot-container {
      position: relative;
      width: 180px;
      height: 230px;
      margin: 0 auto 16px auto;
      background: #000;
      border: 2px solid var(--panel-border);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .mugshot-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.05);
      transition: opacity 0.2s ease;
    }

    /* Tactical Overlay Effect */
    .mugshot-container::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
      background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
    }

    .suspect-name {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
    }

    /* Intelligence Brief (Clues) */
    .brief-box {
      background: #0a0b0d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 16px;
      min-height: 140px;
    }

    .clue-entry {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #1e222a;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .clue-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .clue-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* Inputs */
    .action-stack { display: flex; flex-direction: column; gap: 10px; }

    select, .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      background: #161920;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus { border-color: var(--accent-red); }

    .btn-action {
      background: var(--accent-red);
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .btn-action:hover:not(:disabled) { background: #b71c1c; }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Tracker Dots */
    .attempts-tracker {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .slot {
      width: 12px;
      height: 12px;
      background: var(--panel-border);
      border-radius: 2px;
      transition: all 0.2s;
    }

    .slot.wrong { background: var(--wrong); }
    .slot.correct { background: var(--correct); }
    .slot.active { border: 1px solid #fff; }

    /* Stats Bar */
    .stats-grid {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      background: #090a0c;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      text-align: center;
    }

    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 24px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-body {
      text-align: left;
      background: #090a0c;
      padding: 12px;
      border: 1px solid var(--panel-border);
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 40px 0;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-classified">Official Most Wanted Database</div>
    <h1>WANTED<span>LE</span></h1>
    <p class="subtitle">FBI CRIMINAL CLASSIFICATION SYSTEM</p>
  </header>

  <div class="game-card">

    <!-- 1. HOME SCREEN -->
    <div id="screen-home" class="screen home-menu active">
      <button class="btn-mode primary" onclick="startDailyMode()">
        <span class="btn-title">🎯 DAILY CASE FILE</span>
        <span class="btn-desc">Identify today's primary fugitive. Refreshed daily.</span>
      </button>

      <button class="btn-mode" onclick="startUnlimitedMode()">
        <span class="btn-title">♾️ UNLIMITED ARCHIVES</span>
        <span class="btn-desc">Endless criminal records directly from FBI archives.</span>
      </button>

      <div class="stats-grid">
        <div><div class="stat-num" id="home-stat-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-num" id="home-stat-wins">0</div><div class="stat-lbl">Solved</div></div>
        <div><div class="stat-num" id="home-stat-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <!-- 2. LOADER SCREEN -->
    <div id="screen-loader" class="screen loader">
      <div>[ FETCHING FBI CRIMINAL RECORDS... ]</div>
    </div>

    <!-- 3. GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">
      <div class="nav-bar">
        <button class="btn-back" onclick="showScreen('screen-home')">← ABORT</button>
        <div class="mode-indicator" id="game-mode-tag">DAILY CASE</div>
      </div>

      <div class="mugshot-container">
        <img id="suspect-img" src="" alt="Mugshot" onerror="this.src=SILHOUETTE_SVG">
      </div>

      <div class="suspect-name" id="suspect-title">LOADING...</div>

      <div class="brief-box" id="clues-container"></div>

      <div class="action-stack">
        <select id="crime-select">
          <option value="">-- SELECT PRIMARY CRIME --</option>
        </select>
        <button class="btn-action" id="submit-btn" onclick="submitGuess()">Submit Analysis</button>
      </div>

      <div class="attempts-tracker" id="tracker">
        <div class="slot active"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>

      <div class="stats-grid">
        <div><div class="stat-num" id="stat-played">0</div><div class="stat-lbl">Cases</div></div>
        <div><div class="stat-num" id="stat-wins">0</div><div class="stat-lbl">Wins</div></div>
        <div><div class="stat-num" id="stat-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

  </div>

  <!-- RESULT MODAL -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">CASE CLOSED</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="btn-action" id="modal-btn" onclick="closeModal()">Continue</button>
    </div>
  </div>

  <script>
    // Strict Criminal Category Master List
    const CRIMINAL_CATEGORIES = [
      "Cyber's Most Wanted",
      "White-Collar Crime",
      "Violent Crime - Murders",
      "Counterintelligence",
      "Bank Robbers",
      "Human Trafficking",
      "Criminal Enterprise Investigations",
      "Domestic Terrorism"
    ];

    const SILHOUETTE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="230" viewBox="0 0 180 230"><rect width="100%" height="100%" fill="%23000000"/><path d="M90 40 a35 35 0 1 0 0.1 0 Z M45 190 c0-35 20-50 45-50 s45 15 45 50 Z" fill="%231f232c"/><text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" fill="%2364748b" font-family="monospace" font-size="10">REDACTED</text></svg>`;

    const FALLBACK_CRIMINALS = [
      {
        id: "ruja-ignatova",
        title: "Ruja Ignatova",
        thumbUrl: "https://www.fbi.gov/wanted/topten/ruja-ignatova/@@images/image/thumb",
        subjects: ["White-Collar Crime"],
        hair: "Dark", eyes: "Brown", sex: "Female",
        reward: "Up to $5,000,000",
        office: "NEW YORK",
        aliases: "The Cryptoqueen",
        summary: "Wanted for leadership in a global fraud scheme involving the fake cryptocurrency OneCoin."
      },
      {
        id: "bhadreshkumar-patel",
        title: "Bhadreshkumar Chetanbhai Patel",
        thumbUrl: "https://www.fbi.gov/wanted/topten/bhadreshkumar-chetanbhai-patel/@@images/image/thumb",
        subjects: ["Violent Crime - Murders"],
        hair: "Brown", eyes: "Brown", sex: "Male",
        reward: "Up to $250,000",
        office: "BALTIMORE",
        aliases: "Bhadresh",
        summary: "Wanted for alleged stabbing murder of his wife inside a commercial store in Hanover, Maryland."
      },
      {
        id: "alejandro-castillo",
        title: "Alejandro Rosales Castillo",
        thumbUrl: "https://www.fbi.gov/wanted/topten/alejandro-castillo/@@images/image/thumb",
        subjects: ["Violent Crime - Murders"],
        hair: "Black", eyes: "Brown", sex: "Male",
        reward: "Up to $250,000",
        office: "CHARLOTTE",
        aliases: "Alex Castillo",
        summary: "Wanted for involvement in the murder of a female coworker in Charlotte, North Carolina."
      }
    ];

    let criminalPool = [];
    let seenIds = new Set();
    let currentCase = null;
    let attemptCount = 0;
    const MAX_ATTEMPTS = 5;
    let currentMode = 'daily';
    let unlimitedStats = { played: 0, wins: 0, streak: 0 };

    function populateDropdown() {
      const select = document.getElementById('crime-select');
      select.innerHTML = '<option value="">-- SELECT PRIMARY CRIME --</option>';
      CRIMINAL_CATEGORIES.slice().sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    async function fetchCriminalDatabase() {
      if (criminalPool.length > 0) return criminalPool;

      try {
        // Query specifically for main fugitives/criminals only
        const response = await fetch('https://api.fbi.gov/wanted/v1/list?person_classification=main&pageSize=60');
        if (response.ok) {
          const data = await response.json();
          if (data.items) {
            criminalPool = filterStrictCriminals(data.items);
            if (criminalPool.length > 0) return criminalPool;
          }
        }
      } catch (err) {
        console.warn("Direct API fetch failed, loading contingency database...", err);
      }

      criminalPool = FALLBACK_CRIMINALS;
      return criminalPool;
    }

    function filterStrictCriminals(items) {
      return items.filter(item => {
        if (!item.title || !item.subjects || item.subjects.length === 0) return false;

        // Strictly exclude missing persons, victims, and non-criminal subjects
        const lowerSubjects = item.subjects.map(s => s.toLowerCase());
        const isVictimOrMissing = lowerSubjects.some(s => 
          s.includes('missing') || 
          s.includes('kidnap') || 
          s.includes('seeking info') || 
          s.includes('victim')
        );

        return !isVictimOrMissing;
      }).map(item => {
        // Extract fast thumbnail image
        let rawImg = null;
        if (item.images && item.images.length > 0) {
          rawImg = item.images[0].thumb || item.images[0].large || item.images[0].original;
        }

        // Fast image proxy for instant load
        const fastThumb = rawImg 
          ? `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}&w=180&h=230&fit=cover` 
          : SILHOUETTE_SVG;

        return {
          id: item.uid || item.title,
          title: item.title,
          thumbUrl: fastThumb,
          subjects: item.subjects,
          hair: item.hair_raw || item.hair || 'Unspecified',
          eyes: item.eyes_raw || item.eyes || 'Unspecified',
          sex: item.sex || 'Unspecified',
          reward: item.reward_text || 'No bounty specified',
          office: item.field_offices ? item.field_offices.join(', ').toUpperCase() : 'FEDERAL HQ',
          aliases: item.aliases ? item.aliases.slice(0, 2).join(', ') : 'None Registered',
          summary: item.description || item.caution || 'Case details restricted.'
        };
      });
    }

    async function startDailyMode() {
      currentMode = 'daily';
      showScreen('screen-loader');
      await fetchCriminalDatabase();

      const dateSeed = parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''), 10);
      currentCase = criminalPool[dateSeed % criminalPool.length];

      document.getElementById('game-mode-tag').textContent = 'DAILY CASE';
      setupGameSession();
    }

    async function startUnlimitedMode() {
      currentMode = 'unlimited';
      showScreen('screen-loader');
      await fetchCriminalDatabase();

      let available = criminalPool.filter(c => !seenIds.has(c.id));
      if (available.length === 0) {
        seenIds.clear();
        available = criminalPool;
      }

      currentCase = available[Math.floor(Math.random() * available.length)];
      seenIds.add(currentCase.id);

      document.getElementById('game-mode-tag').textContent = 'UNLIMITED ARCHIVES';
      setupGameSession();
    }

    function setupGameSession() {
      attemptCount = 0;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('crime-select').disabled = false;
      document.getElementById('crime-select').value = '';

      const img = document.getElementById('suspect-img');
      img.src = currentCase.thumbUrl;
      document.getElementById('suspect-title').textContent = redactText(currentCase.title);

      resetTrackerUI();
      renderClues();
      updateStatsUI();
      showScreen('screen-game');
    }

    function renderClues() {
      const container = document.getElementById('clues-container');
      container.innerHTML = '';

      const clues = [
        { tag: 'PHYSICAL PROFILE', text: `Sex: ${currentCase.sex} | Hair: ${currentCase.hair} | Eyes: ${currentCase.eyes}` },
        { tag: 'BOUNTY / REWARD', text: redactText(currentCase.reward) },
        { tag: 'FIELD OFFICE', text: currentCase.office },
        { tag: 'KNOWN ALIASES', text: redactText(currentCase.aliases) },
        { tag: 'SUMMARY OF OFFENSE', text: redactSummary(currentCase.summary) }
      ];

      for (let i = 0; i <= attemptCount && i < clues.length; i++) {
        const div = document.createElement('div');
        div.className = 'clue-entry';
        div.innerHTML = `<div class="clue-tag">CLUE 0${i+1} // ${clues[i].tag}</div><div>${clues[i].text}</div>`;
        container.appendChild(div);
      }
    }

    function redactText(str) {
      if (!str) return '';
      let text = str;
      CRIMINAL_CATEGORIES.forEach(cat => {
        cat.split(' ').forEach(word => {
          if (word.length > 3) {
            const reg = new RegExp(word, 'gi');
            text = text.replace(reg, '[REDACTED]');
          }
        });
      });
      return text;
    }

    function redactSummary(text) {
      let cleaned = redactText(text);
      return cleaned.length > 170 ? cleaned.substring(0, 170) + '...' : cleaned;
    }

    function submitGuess() {
      const select = document.getElementById('crime-select');
      const val = select.value;
      if (!val) return;

      const slots = document.querySelectorAll('.slot');
      const actual = currentCase.subjects.map(s => s.toLowerCase());
      const isCorrect = actual.some(a => a.includes(val.toLowerCase()) || val.toLowerCase().includes(a));

      if (isCorrect) {
        slots[attemptCount].className = 'slot correct';
        endSession(true);
      } else {
        slots[attemptCount].className = 'slot wrong';
        attemptCount++;

        if (attemptCount < MAX_ATTEMPTS) {
          slots[attemptCount].className = 'slot active';
          renderClues();
        } else {
          endSession(false);
        }
      }
    }

    function endSession(won) {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('crime-select').disabled = true;

      updateStats(won);

      const modal = document.getElementById('result-modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      const btn = document.getElementById('modal-btn');

      title.textContent = won ? 'CASE SOLVED' : 'SUSPECT AT LARGE';
      title.style.color = won ? 'var(--correct)' : 'var(--wrong)';

      body.innerHTML = `
        <strong>Fugitive:</strong> ${currentCase.title}<br>
        <strong>Primary Category:</strong> ${currentCase.subjects.join(', ')}
      `;

      btn.textContent = currentMode === 'unlimited' ? 'Next Suspect ➔' : 'Close File';
      setTimeout(() => modal.classList.add('active'), 400);
    }

    function closeModal() {
      document.getElementById('result-modal').classList.remove('active');
      if (currentMode === 'unlimited') {
        startUnlimitedMode();
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function resetTrackerUI() {
      const slots = document.querySelectorAll('.slot');
      slots.forEach((s, idx) => s.className = idx === 0 ? 'slot active' : 'slot');
    }

    function updateStats(won) {
      if (currentMode === 'daily') {
        let stats = JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 };
        stats.played++;
        if (won) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
        localStorage.setItem('wantedle_stats', JSON.stringify(stats));
      } else {
        unlimitedStats.played++;
        if (won) { unlimitedStats.wins++; unlimitedStats.streak++; } else { unlimitedStats.streak = 0; }
      }
      updateStatsUI();
    }

    function updateStatsUI() {
      let stats = currentMode === 'daily' 
        ? (JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 })
        : unlimitedStats;

      document.getElementById('stat-played').textContent = stats.played;
      document.getElementById('stat-wins').textContent = stats.wins;
      document.getElementById('stat-streak').textContent = stats.streak;

      document.getElementById('home-stat-played').textContent = stats.played;
      document.getElementById('home-stat-wins').textContent = stats.wins;
      document.getElementById('home-stat-streak').textContent = stats.streak;
    }

    populateDropdown();
    updateStatsUI();
  </script>
</body>
</html>
