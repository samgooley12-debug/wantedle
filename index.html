<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTEDLE — Guess the Criminal Category</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --border: #262933;
      --text: #f3f4f6;
      --muted: #8c95a6;
      --correct: #22c55e;
      --wrong: #ef4444;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .brand span { color: var(--accent); }

    .mode-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: #1e222d;
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Home Menu */
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-mode {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mode:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-mode.primary {
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
      border-color: var(--accent);
    }

    .btn-mode-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-mode-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Face Mugshot Framing */
    .image-stage {
      width: 200px;
      height: 200px;
      margin: 0 auto 16px auto;
      background: #000;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      border: 3px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .image-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%; /* Zooms strictly onto suspect's face */
    }

    .stage-overlay {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      border: 1px solid var(--border);
    }

    /* Clue Box */
    .clue-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
      min-height: 110px;
    }

    .clue-header {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .clue-content {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Track Progress Squares */
    .tracker-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .track-square {
      height: 10px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.2s ease;
    }

    .track-square.wrong { background: var(--wrong); }
    .track-square.correct { background: var(--correct); }
    .track-square.active { background: var(--accent); }

    /* Dropdown Selection Bar */
    .input-wrapper {
      margin-bottom: 20px;
    }

    .picker-bar {
      display: flex;
      gap: 8px;
    }

    select {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }

    select:focus {
      border-color: var(--accent);
    }

    select option {
      background: #16181e;
      color: #fff;
      padding: 10px;
    }

    .btn-submit {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .btn-submit:hover:not(:disabled) { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Stats Display */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-val { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    .loader {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* End Screen Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .modal-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 12px; }
    .modal-body {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">WANTED<span>LE</span></div>
    <div class="mode-badge" id="mode-badge">DAILY</div>
  </header>

  <div class="app-container">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="menu-stack">
        <button class="btn-mode primary" onclick="launchMode('daily')">
          <div class="btn-mode-title">🎯 Daily Case</div>
          <div class="btn-mode-desc">Analyze clues to identify today's primary crime category.</div>
        </button>

        <button class="btn-mode" onclick="launchMode('unlimited')">
          <div class="btn-mode-title">♾️ Unlimited Mode</div>
          <div class="btn-mode-desc">Play endless cases with clear, progressive evidence files.</div>
        </button>
      </div>

      <div class="stats-row">
        <div><div class="stat-val" id="h-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-val" id="h-wins">0</div><div class="stat-lbl">Solved</div></div>
        <div><div class="stat-val" id="h-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <!-- LOADER -->
    <div id="screen-loader" class="screen loader">
      Preparing Wantedle Case Files...
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">

      <div class="image-stage">
        <img id="suspect-img" src="" alt="Suspect Face Mugshot">
        <div class="stage-overlay" id="attempt-indicator">CLUE 1/5</div>
      </div>

      <div class="clue-card">
        <div class="clue-header" id="clue-title">CLUE 1</div>
        <div class="clue-content" id="clue-body">Reviewing case notes...</div>
      </div>

      <div class="tracker-bar">
        <div class="track-square active"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
      </div>

      <div class="input-wrapper">
        <div class="picker-bar">
          <select id="crime-select">
            <option value="" disabled selected>Select 1 of 15 categories...</option>
          </select>
          <button class="btn-submit" id="submit-btn" onclick="submitGuess()">SUBMIT</button>
        </div>
      </div>

      <div class="stats-row">
        <div><div class="stat-val" id="g-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-val" id="g-wins">0</div><div class="stat-lbl">Wins</div></div>
        <div><div class="stat-val" id="g-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>

    </div>

  </div>

  <!-- RESULT MODAL -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">CASE CLOSED</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="btn-submit" style="width: 100%; height: 44px;" onclick="closeModal()">CONTINUE</button>
    </div>
  </div>

  <script>
    // EXACT 15 EASY-TO-UNDERSTAND CATEGORIES
    const MASTER_15_CATEGORIES = [
      "Bank Robbery",
      "Cyber Crime",
      "Domestic Terrorism",
      "Drug Trafficking",
      "Human Trafficking",
      "International Terrorism",
      "Money Laundering",
      "Murder / Homicide",
      "Organized Crime",
      "Public Corruption",
      "Racketeering & Extortion",
      "Weapons & Arms Offenses",
      "White-Collar & Fraud",
      "Art & Intellectual Theft",
      "Violent Assault & Crimes"
    ];

    let criminalPool = [];
    let currentCase = null;
    let attemptCount = 0;
    const MAX_ATTEMPTS = 5;
    let currentMode = 'daily';
    let unlimitedStats = { played: 0, wins: 0, streak: 0 };

    function populateDropdown() {
      const select = document.getElementById('crime-select');
      select.innerHTML = '<option value="" disabled selected>Select 1 of 15 categories...</option>';
      MASTER_15_CATEGORIES.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    async function loadDatabase() {
      if (criminalPool.length > 0) return;

      try {
        const res = await fetch('https://api.fbi.gov/wanted/v1/list?person_classification=main&pageSize=100');
        if (res.ok) {
          const data = await res.json();
          if (data.items) {
            criminalPool = parseCriminals(data.items);
          }
        }
      } catch (e) {
        console.warn("API offline - applying curated database.", e);
      }

      // Guaranteed offline backup with real photo URLs
      if (criminalPool.length === 0) {
        criminalPool = [
          {
            id: "ruja-ignatova",
            title: "Ruja Ignatova",
            thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/ruja-ignatova/@@images/image/thumb&w=300&h=300&fit=cover",
            category: "White-Collar & Fraud",
            region: "New York Area",
            bounty: "$5,000,000 Reward Offered",
            howTheyOperate: "Used fake digital investment tokens and offshore bank accounts to take money from thousands of victims.",
            targets: "Investors, retirement accounts, and international financial institutions.",
            fullStory: "Accused of running a massive fake cryptocurrency company that stole over four billion dollars from investors worldwide before going into hiding."
          },
          {
            id: "bhadreshkumar-patel",
            title: "Bhadreshkumar Chetanbhai Patel",
            thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/bhadreshkumar-chetanbhai-patel/@@images/image/thumb&w=300&h=300&fit=cover",
            category: "Murder / Homicide",
            region: "Baltimore & Maryland Area",
            bounty: "$250,000 Reward Offered",
            howTheyOperate: "Used a sharp weapon during a sudden altercation inside a commercial building before escaping on foot.",
            targets: "A coworker working the night shift inside a retail facility.",
            fullStory: "Wanted for striking and killing his coworker inside a donut shop during a night shift before fleeing the scene."
          }
        ];
      }
    }

    function parseCriminals(items) {
      const EXCLUDE = ['missing', 'kidnap', 'victim', 'deceased', 'captured', 'located', 'seeking info - missing'];

      return items.filter(item => {
        // STRICT MUGSHOT / PORTRAIT FILTER: Must have a genuine image
        if (!item.images || item.images.length === 0) return false;
        const img = item.images[0].thumb || item.images[0].large;
        if (!img || img.includes('silhouette') || img.includes('no_image') || img.includes('default')) return false;

        if (!item.title || !item.subjects || item.subjects.length === 0) return false;
        const subjStr = item.subjects.map(s => s.toLowerCase()).join(' ');
        const descStr = (item.description || '').toLowerCase();

        const isForbidden = EXCLUDE.some(term => subjStr.includes(term) || descStr.includes(term));
        if (item.status && item.status.toLowerCase() !== 'na' && item.status.toLowerCase() !== 'active') return false;

        return !isForbidden;
      }).map(item => {
        const rawImg = item.images[0].thumb || item.images[0].large;
        const fastImg = `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}&w=300&h=300&fit=cover`;

        const mappedCategory = mapTo15Categories(item.subjects);

        // CLEAR, ENGAGING ENGLISH CLUES — ZERO "UNKNOWN" / ZERO CRYPTIC CODES
        const region = (item.field_offices && item.field_offices.length > 0)
          ? item.field_offices[0].charAt(0).toUpperCase() + item.field_offices[0].slice(1) + " Division"
          : "U.S. Federal Jurisdiction";

        const bounty = (item.reward_text && item.reward_text.length > 8 && !item.reward_text.toLowerCase().includes('unknown'))
          ? item.reward_text
          : "Official Federal Cash Reward Offered";

        let cleanText = (item.description || item.caution || item.details || '')
          .replace(/<[^>]*>?/gm, '').trim();

        if (!cleanText || cleanText.length < 25 || cleanText.toLowerCase().includes('unknown')) {
          cleanText = `Suspect is actively sought in connection with serious federal law violations regarding ${mappedCategory}.`;
        }

        let tactics = (item.remarks || item.warning_message || '')
          .replace(/<[^>]*>?/gm, '').trim();

        if (!tactics || tactics.length < 15 || tactics.toLowerCase().includes('unknown')) {
          tactics = `Known to use false identity documents, travel under fake names, and avoid public places to hide from police.`;
        }

        const howTheyOperate = tactics;
        const targets = `Public facilities, individuals, or institutions affected by ${mappedCategory}.`;
        const fullStory = cleanText;

        return {
          id: item.uid || item.title,
          title: item.title,
          thumbUrl: fastImg,
          category: mappedCategory,
          region: region,
          bounty: bounty,
          howTheyOperate: howTheyOperate,
          targets: targets,
          fullStory: fullStory
        };
      });
    }

    function mapTo15Categories(subjects) {
      const text = subjects.join(' ').toLowerCase();

      if (text.includes('cyber') || text.includes('computer') || text.includes('ransomware') || text.includes('hacker')) return "Cyber Crime";
      if (text.includes('bank') || text.includes('robbery') || text.includes('teller')) return "Bank Robbery";
      if (text.includes('murder') || text.includes('homicide') || text.includes('death') || text.includes('killed')) return "Murder / Homicide";
      if (text.includes('white-collar') || text.includes('fraud') || text.includes('corporate') || text.includes('financial') || text.includes('sec')) return "White-Collar & Fraud";
      if (text.includes('drug') || text.includes('narcotics') || text.includes('cocaine') || text.includes('heroin')) return "Drug Trafficking";
      if (text.includes('human') || text.includes('trafficking') || text.includes('smuggling')) return "Human Trafficking";
      if (text.includes('domestic terrorism')) return "Domestic Terrorism";
      if (text.includes('international terrorism') || text.includes('counterintelligence') || text.includes('espionage')) return "International Terrorism";
      if (text.includes('laundering')) return "Money Laundering";
      if (text.includes('organized') || text.includes('enterprise') || text.includes('cartel')) return "Organized Crime";
      if (text.includes('corruption') || text.includes('civil rights') || text.includes('official')) return "Public Corruption";
      if (text.includes('racketeering') || text.includes('extortion')) return "Racketeering & Extortion";
      if (text.includes('weapon') || text.includes('arms') || text.includes('firearm')) return "Weapons & Arms Offenses";
      if (text.includes('art') || text.includes('intellectual') || text.includes('copyright')) return "Art & Intellectual Theft";

      return "Violent Assault & Crimes";
    }

    async function launchMode(mode) {
      currentMode = mode;
      document.getElementById('mode-badge').textContent = mode.toUpperCase();
      showScreen('screen-loader');

      await loadDatabase();
      populateDropdown();

      if (mode === 'daily') {
        const seed = parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''), 10);
        currentCase = criminalPool[seed % criminalPool.length];
      } else {
        currentCase = criminalPool[Math.floor(Math.random() * criminalPool.length)];
      }

      setupGame();
    }

    function setupGame() {
      attemptCount = 0;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('crime-select').disabled = false;
      document.getElementById('crime-select').selectedIndex = 0;

      document.getElementById('suspect-img').src = currentCase.thumbUrl;

      renderCurrentClue();
      updateTracker();
      updateStats();
      showScreen('screen-game');
    }

    // PROGRESSIVE CLUE STRUCTURE: Hard -> Solvable on Clue 5
    function renderCurrentClue() {
      document.getElementById('attempt-indicator').textContent = `CLUE ${attemptCount + 1}/5`;

      const clues = [
        {
          title: "CLUE 1 // LOCATION & REWARD (HARD)",
          body: `<strong>MAIN LOCATION:</strong> ${currentCase.region}<br><strong>REWARD STATUS:</strong> ${currentCase.bounty}`
        },
        {
          title: "CLUE 2 // HOW THEY OPERATE (MEDIUM-HARD)",
          body: `<strong>SUSPECT BEHAVIOR:</strong> ${maskKeywords(currentCase.howTheyOperate, 3)}`
        },
        {
          title: "CLUE 3 // TARGETS & METHODS (MEDIUM)",
          body: `<strong>TYPICAL TARGETS:</strong> ${maskKeywords(currentCase.targets, 2)}`
        },
        {
          title: "CLUE 4 // WHAT HAPPENED (EASY)",
          body: `<strong>CASE SUMMARY:</strong> ${maskKeywords(currentCase.fullStory, 1)}`
        },
        {
          title: "CLUE 5 // FULL INCIDENT STORY (GIVE-AWAY)",
          body: `<strong>FULL CASE STORY:</strong> ${maskCategoryOnly(currentCase.fullStory)}`
        }
      ];

      document.getElementById('clue-title').textContent = clues[attemptCount].title;
      document.getElementById('clue-body').innerHTML = clues[attemptCount].body;
    }

    // Mask specific giveaway words without creating messy text
    function maskKeywords(text, level) {
      if (!text) return '';
      let out = text;

      const primary = [
        'bank', 'robbery', 'robber', 'cyber', 'computer', 'hacker', 'fraud', 'wire', 'scheme',
        'murder', 'homicide', 'killed', 'shot', 'drug', 'narcotics', 'cocaine', 'heroin',
        'terrorism', 'terrorist', 'laundering', 'money', 'racketeering', 'extortion',
        'weapon', 'firearm', 'guns', 'trafficking', 'bribe', 'corruption', 'stolen', 'art'
      ];

      primary.forEach(w => {
        const reg = new RegExp('\\b' + w + '\\b', 'gi');
        out = out.replace(reg, '████');
      });

      if (level >= 2) {
        out = out.replace(/\b(victim|assault|cartel|company|bank|account|financial|investor|stole|weapon)\b/gi, '████');
      }

      if (level >= 3) {
        out = out.replace(/\b(police|arrest|fled|obtained|cash|vault|computer)\b/gi, '████');
      }

      return out;
    }

    // Hide only words that match the answer category
    function maskCategoryOnly(text) {
      let out = text;
      const targetCat = currentCase.category.toLowerCase();
      targetCat.split(' ').forEach(w => {
        if (w.length > 2 && w !== '&' && w !== '/') {
          const reg = new RegExp('\\b' + w + '\\b', 'gi');
          out = out.replace(reg, '████');
        }
      });
      return out;
    }

    function submitGuess() {
      const select = document.getElementById('crime-select');
      const guess = select.value;
      if (!guess) return;

      const isCorrect = guess === currentCase.category;
      const squares = document.querySelectorAll('.track-square');

      if (isCorrect) {
        squares[attemptCount].className = 'track-square correct';
        endGame(true);
      } else {
        squares[attemptCount].className = 'track-square wrong';
        attemptCount++;

        if (attemptCount < MAX_ATTEMPTS) {
          squares[attemptCount].className = 'track-square active';
          renderCurrentClue();
          select.selectedIndex = 0;
        } else {
          endGame(false);
        }
      }
    }

    function endGame(won) {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('crime-select').disabled = true;

      saveMetrics(won);

      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      title.textContent = won ? 'CORRECT CATEGORY!' : 'OUT OF ATTEMPTS';
      title.style.color = won ? 'var(--correct)' : 'var(--wrong)';

      body.innerHTML = `
        <strong>Suspect:</strong> ${currentCase.title}<br>
        <strong>Correct Category:</strong> ${currentCase.category}<br><br>
        <em>${currentCase.fullStory}</em>
      `;

      setTimeout(() => modal.classList.add('active'), 300);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (currentMode === 'unlimited') {
        launchMode('unlimited');
      } else {
        showScreen('screen-home');
      }
    }

    function updateTracker() {
      const squares = document.querySelectorAll('.track-square');
      squares.forEach((sq, i) => sq.className = i === 0 ? 'track-square active' : 'track-square');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function saveMetrics(won) {
      if (currentMode === 'daily') {
        let stats = JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 };
        stats.played++;
        if (won) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
        localStorage.setItem('wantedle_stats', JSON.stringify(stats));
      } else {
        unlimitedStats.played++;
        if (won) { unlimitedStats.wins++; unlimitedStats.streak++; } else { unlimitedStats.streak = 0; }
      }
      updateStats();
    }

    function updateStats() {
      let stats = currentMode === 'daily'
        ? (JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 })
        : unlimitedStats;

      document.getElementById('h-played').textContent = stats.played;
      document.getElementById('h-wins').textContent = stats.wins;
      document.getElementById('h-streak').textContent = stats.streak;

      document.getElementById('g-played').textContent = stats.played;
      document.getElementById('g-wins').textContent = stats.wins;
      document.getElementById('g-streak').textContent = stats.streak;
    }

    updateStats();
  </script>
</body>
</html>
