<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WANTEDLE — Guess the FBI Most Wanted Crime</title>
  
  <meta name="description" content="A daily and unlimited FBI Most Wanted guessing game. Test your detective skills!">
  <meta property="og:title" content="WANTEDLE — FBI Fugitive Game">

  <style>
    :root {
      --bg: #0f0f10;
      --card-bg: #18181a;
      --border: #2e2e32;
      --border-glow: #44444a;
      --accent: #c02626;
      --accent-hover: #e02e2e;
      --text: #f0f0f2;
      --subtext: #8e8e93;
      --correct: #43a047;
      --wrong: #e53935;
      --transition-speed: 0.25s;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }

    body { 
      background-color: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
      overflow-x: hidden;
    }

    header { 
      text-align: center; 
      margin-bottom: 20px; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 15px; 
      width: 100%; 
      max-width: 520px; 
      animation: fadeInDown 0.5s ease-out;
    }

    h1 { 
      font-size: 2.4rem; 
      letter-spacing: 4px; 
      color: var(--accent); 
      font-weight: 900; 
      text-shadow: 0 0 15px rgba(192, 38, 38, 0.3);
    }

    p.subtitle { 
      color: var(--subtext); 
      font-size: 0.9rem; 
      margin-top: 4px; 
    }

    .game-container { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      width: 100%; 
      max-width: 520px; 
      padding: 24px; 
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      position: relative;
    }

    /* Screen Transitions */
    .screen {
      opacity: 0;
      transform: scale(0.98);
      transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
      display: none;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: scale(1);
    }

    /* Home Screen Styles */
    .home-card { 
      text-align: center; 
      gap: 16px; 
    }

    .mode-btn { 
      background: #222225; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 20px; 
      color: white; 
      font-size: 1.15rem; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 6px; 
      outline: none;
    }

    .mode-btn:hover { 
      background: #2a2a2e; 
      border-color: var(--accent); 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(192, 38, 38, 0.2);
    }

    .mode-btn:active {
      transform: translateY(0);
    }

    .mode-btn.primary { 
      background: var(--accent); 
      border: none; 
    }

    .mode-btn.primary:hover { 
      background: var(--accent-hover); 
      box-shadow: 0 6px 20px rgba(224, 46, 46, 0.4);
    }

    .mode-desc { 
      font-size: 0.82rem; 
      font-weight: 400; 
      color: rgba(255,255,255,0.75); 
    }

    /* Top Nav in Game */
    .game-nav { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 18px; 
      border-bottom: 1px dashed var(--border); 
      padding-bottom: 12px; 
    }

    .nav-btn { 
      background: transparent; 
      border: 1px solid var(--border); 
      color: var(--subtext); 
      padding: 8px 14px; 
      font-size: 0.85rem; 
      font-weight: 600;
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }

    .nav-btn:hover { 
      color: white; 
      border-color: var(--text); 
      background: rgba(255,255,255,0.05);
    }

    .mode-badge { 
      font-size: 0.75rem; 
      text-transform: uppercase; 
      font-weight: 800; 
      background: #222225; 
      padding: 6px 12px; 
      border-radius: 20px; 
      color: var(--accent); 
      border: 1px solid rgba(192, 38, 38, 0.3);
      letter-spacing: 0.5px; 
    }

    /* Game Image Frame */
    .image-wrapper { 
      text-align: center; 
      margin-bottom: 18px; 
      position: relative; 
      display: flex; 
      justify-content: center; 
      perspective: 1000px;
    }

    .image-wrapper img { 
      width: 210px; 
      height: 260px; 
      object-fit: cover; 
      border-radius: 12px; 
      border: 3px solid var(--border); 
      background-color: #222225; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.4s ease, border-color 0.3s ease;
    }

    .image-wrapper img:hover {
      border-color: var(--border-glow);
      transform: scale(1.02);
    }

    .fugitive-name { 
      text-align: center; 
      font-size: 1.35rem; 
      font-weight: 800; 
      margin-bottom: 16px; 
      letter-spacing: 0.5px;
    }

    /* Clues Section */
    .clues-box { 
      background: #111113; 
      border: 1px solid var(--border);
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 20px; 
      font-size: 0.9rem; 
      min-height: 120px;
    }

    .clue-item { 
      margin-bottom: 12px; 
      padding-bottom: 10px; 
      border-bottom: 1px dashed var(--border); 
      animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1); 
    }

    .clue-item:last-child { 
      margin-bottom: 0; 
      padding-bottom: 0; 
      border-bottom: none; 
    }

    .clue-label { 
      font-weight: 800; 
      color: var(--accent); 
      text-transform: uppercase; 
      font-size: 0.72rem; 
      letter-spacing: 0.8px; 
      margin-bottom: 3px; 
    }

    /* Controls & Dropdown */
    .controls { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }

    select, button.btn-submit { 
      padding: 14px; 
      font-size: 1rem; 
      border-radius: 10px; 
      border: 1px solid var(--border); 
      background: #222225; 
      color: white; 
      outline: none; 
      transition: all 0.2s ease;
    }

    select:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(192, 38, 38, 0.2);
    }

    button.btn-submit { 
      background: var(--accent); 
      color: white; 
      border: none; 
      font-weight: 700; 
      cursor: pointer; 
      letter-spacing: 0.5px;
    }

    button.btn-submit:hover:not(:disabled) { 
      background: var(--accent-hover); 
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(224, 46, 46, 0.3);
    }

    button.btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled { 
      opacity: 0.35; 
      cursor: not-allowed; 
    }

    /* Guess Dots */
    .guesses-tracker { 
      display: flex; 
      justify-content: center; 
      gap: 10px; 
      margin-top: 18px; 
    }

    .dot { 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      background: var(--border); 
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); 
    }

    .dot.wrong { 
      background: var(--wrong); 
      transform: scale(1.25); 
      box-shadow: 0 0 10px rgba(229, 57, 53, 0.5);
    }

    .dot.correct { 
      background: var(--correct); 
      transform: scale(1.25); 
      box-shadow: 0 0 10px rgba(67, 160, 71, 0.5);
    }

    .dot.current { 
      border: 2px solid var(--text); 
      transform: scale(1.1);
    }

    /* Stats Bar */
    .stats-bar { 
      display: flex; 
      justify-content: space-around; 
      margin-top: 22px; 
      text-align: center; 
      background: #111113; 
      padding: 12px; 
      border-radius: 10px; 
      border: 1px solid var(--border);
    }

    .stat-val { 
      font-size: 1.25rem; 
      font-weight: 800; 
    }

    .stat-lbl { 
      font-size: 0.68rem; 
      color: var(--subtext); 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Modal Styling */
    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      backdrop-filter: blur(6px);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.3s ease; 
      z-index: 100; 
    }

    .modal.active { 
      opacity: 1; 
      pointer-events: auto; 
    }

    .modal-content { 
      background: var(--card-bg); 
      padding: 32px 24px; 
      border-radius: 16px; 
      max-width: 420px; 
      text-align: center; 
      border: 1px solid var(--border); 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .modal h2 { 
      font-size: 1.8rem; 
      letter-spacing: 1px; 
      font-weight: 900;
    }

    /* Loader */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Keyframes */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>WANTEDLE</h1>
    <p class="subtitle">Guess the FBI Most Wanted crime category</p>
  </header>

  <div class="game-container" id="main-container">
    
    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="screen home-card active">
      <button class="mode-btn primary" onclick="startDailyMode()">
        <span>📅 Play Daily Case</span>
        <span class="mode-desc">Official FBI case refreshed daily</span>
      </button>

      <button class="mode-btn" onclick="startUnlimitedMode()">
        <span>♾️ Play Unlimited Mode</span>
        <span class="mode-desc">Cycle through every fugitive in the full database</span>
      </button>

      <div class="stats-bar">
        <div><div class="stat-val" id="home-stat-played">0</div><div class="stat-lbl">Daily Played</div></div>
        <div><div class="stat-val" id="home-stat-wins">0</div><div class="stat-lbl">Daily Wins</div></div>
        <div><div class="stat-val" id="home-stat-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <!-- 2. GAME LOADING SCREEN -->
    <div id="loader" class="screen loader-container">
      <div class="spinner"></div>
      <div style="color: var(--subtext); font-size: 0.95rem;" id="loader-text">Accessing FBI Archives...</div>
    </div>

    <!-- 3. MAIN GAME SCREEN -->
    <div id="game-ui" class="screen">
      <div class="game-nav">
        <button class="nav-btn" onclick="returnToHome()">← Home</button>
        <div class="mode-badge" id="nav-mode-badge">Daily Case</div>
      </div>

      <div class="image-wrapper">
        <img id="fugitive-img" src="" alt="Fugitive Mugshot" onerror="handleImageError(this)">
      </div>
      
      <div class="fugitive-name" id="fugitive-title">Loading...</div>

      <div class="clues-box" id="clues-list"></div>

      <div class="controls">
        <select id="crime-select">
          <option value="">-- Choose Primary Crime --</option>
        </select>
        <button class="btn-submit" id="submit-btn" onclick="makeGuess()">Submit Guess</button>
      </div>

      <div class="guesses-tracker" id="tracker">
        <div class="dot current"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="stats-bar" id="game-stats-bar">
        <div><div class="stat-val" id="stat-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-val" id="stat-wins">0</div><div class="stat-lbl">Wins</div></div>
        <div><div class="stat-val" id="stat-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

  </div>

  <!-- RESULT MODAL -->
  <div class="modal" id="game-modal">
    <div class="modal-content">
      <h2 id="modal-title">RESULT</h2>
      <div id="modal-body" style="text-align: left; background: #111113; padding: 16px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.95rem; line-height: 1.5;">Details</div>
      <button class="btn-submit" id="modal-action-btn" onclick="handleModalAction()">Next Case</button>
      <button class="nav-btn" style="width: 100%; padding: 12px;" onclick="returnToHome()">Main Menu</button>
    </div>
  </div>

  <script>
    const CRIME_CATEGORIES = [
      "Cyber's Most Wanted",
      "White-Collar Crime",
      "Violent Crime - Murders",
      "Counterintelligence",
      "Bank Robbers",
      "Human Trafficking",
      "Criminal Enterprise Investigations",
      "Domestic Terrorism",
      "Seeking Information"
    ];

    const SILHOUETTE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="210" height="260" viewBox="0 0 200 250"><rect width="100%" height="100%" fill="%23222225"/><path d="M100 40 a40 40 0 1 0 0.1 0 Z M50 210 c0-40 20-60 50-60 s50 20 50 60 Z" fill="%233a3a3c"/><text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" fill="%238e8e93" font-family="sans-serif" font-size="12">PHOTO REDACTED</text></svg>`;

    const FALLBACK_CASES = [
      {
        title: "Ruja Ignatova",
        images: [{ original: "https://www.fbi.gov/wanted/topten/ruja-ignatova/@@images/image" }],
        subjects: ["White-Collar Crime"],
        hair_raw: "Dark", eyes_raw: "Brown", sex: "Female",
        reward_text: "Up to $5,000,000",
        field_offices: ["New York"],
        aliases: ["The Cryptoqueen"],
        description: "Participated in a massive fraud scheme involving the fake cryptocurrency OneCoin."
      },
      {
        title: "Bhadreshkumar Chetanbhai Patel",
        images: [{ original: "https://www.fbi.gov/wanted/topten/bhadreshkumar-chetanbhai-patel/@@images/image" }],
        subjects: ["Violent Crime - Murders"],
        hair_raw: "Brown", eyes_raw: "Brown", sex: "Male",
        reward_text: "Up to $250,000",
        field_offices: ["Baltimore"],
        aliases: ["Bhadresh"],
        description: "Wanted for allegedly stabbing his wife to death inside a donut shop in Hanover, Maryland."
      },
      {
        title: "Alejandro Rosales Castillo",
        images: [{ original: "https://www.fbi.gov/wanted/topten/alejandro-castillo/@@images/image" }],
        subjects: ["Violent Crime - Murders"],
        hair_raw: "Black", eyes_raw: "Brown", sex: "Male",
        reward_text: "Up to $250,000",
        field_offices: ["Charlotte"],
        aliases: ["Alex Castillo"],
        description: "Wanted for his alleged involvement in the murder of a female co-worker in Charlotte, North Carolina."
      }
    ];

    let fugitivePool = [];
    let seenFugitiveIds = new Set();
    let fugitive = null;
    let currentAttempt = 0;
    const MAX_ATTEMPTS = 5;
    let userGuessed = false;
    let activeMode = 'daily'; 

    let unlimitedStats = { played: 0, wins: 0, streak: 0 };
    const TODAY_KEY = `wantedle_${new Date().toISOString().slice(0,10)}`;

    function populateDropdown() {
      const select = document.getElementById('crime-select');
      select.innerHTML = '<option value="">-- Choose Primary Crime --</option>';
      CRIME_CATEGORIES.slice().sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    // Shuffle helper to make sure Unlimited mode cycles randomly through everyone
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    async function fetchFugitiveData() {
      if (fugitivePool.length > 0) return fugitivePool;

      const loaderText = document.getElementById('loader-text');
      loaderText.textContent = "Connecting to FBI Live Database...";

      try {
        // Attempt 1: Fetch multiple pages directly from the official FBI API
        let allItems = [];
        const pagesToFetch = [1, 2, 3];

        for (const page of pagesToFetch) {
          const res = await fetch(`https://api.fbi.gov/wanted/v1/list?page=${page}&pageSize=50`);
          if (res.ok) {
            const data = await res.json();
            if (data.items) allItems.push(...data.items);
          }
        }

        if (allItems.length > 0) {
          fugitivePool = processRawItems(allItems);
          shuffleArray(fugitivePool);
          return fugitivePool;
        }
      } catch (err) {
        console.warn("Direct FBI API fetch failed, trying proxy fallback...", err);
      }

      // Attempt 2: CORS Proxy backup
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.fbi.gov/wanted/v1/list?page=1&pageSize=50')}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const data = await res.json();
          const items = data.items || data;
          if (items && items.length > 0) {
            fugitivePool = processRawItems(items);
            shuffleArray(fugitivePool);
            return fugitivePool;
          }
        }
      } catch (err) {
        console.warn("Proxy attempt failed:", err);
      }

      // Attempt 3: Local Fallback
      console.warn("Using built-in fallback dataset.");
      fugitivePool = processRawItems(FALLBACK_CASES);
      return fugitivePool;
    }

    function processRawItems(items) {
      return items.filter(item => item && item.title).map(item => ({
        id: item.uid || item.title,
        title: item.title,
        images: item.images || [],
        subjects: (item.subjects && item.subjects.length > 0) ? item.subjects : ["Seeking Information"],
        hair_raw: item.hair_raw || item.hair || 'Unspecified',
        eyes_raw: item.eyes_raw || item.eyes || 'Unspecified',
        sex: item.sex || 'Unspecified',
        reward_text: item.reward_text || null,
        field_offices: item.field_offices || [],
        aliases: item.aliases || [],
        description: item.description || item.caution || item.details || 'No detailed summary provided in official record.'
      }));
    }

    function getNextUnlimitedFugitive() {
      // Filter out candidates already seen
      let available = fugitivePool.filter(f => !seenFugitiveIds.has(f.id));
      
      // Reset tracker if we completed the entire archive
      if (available.length === 0) {
        seenFugitiveIds.clear();
        available = fugitivePool;
      }

      const picked = available[Math.floor(Math.random() * available.length)];
      seenFugitiveIds.add(picked.id);
      return picked;
    }

    async function startDailyMode() {
      activeMode = 'daily';
      showScreen('loader');

      await fetchFugitiveData();

      const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
      const daySeed = parseInt(dateStr, 10);
      fugitive = fugitivePool[daySeed % fugitivePool.length];

      document.getElementById('nav-mode-badge').textContent = 'Daily Case';
      showScreen('game-ui');
      resetGameUI();
      renderFugitiveCard();
      checkExistingDailySession();
    }

    async function startUnlimitedMode() {
      activeMode = 'unlimited';
      showScreen('loader');

      await fetchFugitiveData();
      fugitive = getNextUnlimitedFugitive();

      document.getElementById('nav-mode-badge').textContent = 'Unlimited Mode';
      showScreen('game-ui');
      resetGameUI();
      renderFugitiveCard();
    }

    function resetGameUI() {
      currentAttempt = 0;
      userGuessed = false;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('crime-select').disabled = false;
      document.getElementById('crime-select').value = '';

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.className = idx === 0 ? 'dot current' : 'dot';
      });

      updateStatsUI();
    }

    function showScreen(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));

      setTimeout(() => {
        screens.forEach(s => s.style.display = 'none');
        const target = document.getElementById(screenId);
        target.style.display = screenId === 'home-screen' ? 'flex' : 'block';
        if (screenId === 'home-screen') target.classList.add('home-card');
        
        // Trigger reflow for smooth animation
        void target.offsetWidth;
        target.classList.add('active');
      }, 150);
    }

    function returnToHome() {
      closeModal();
      updateHomeStatsUI();
      showScreen('home-screen');
    }

    function getProxyImageUrl(rawUrl) {
      if (!rawUrl) return SILHOUETTE_SVG;
      return `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}&w=300&h=380&fit=cover`;
    }

    function renderFugitiveCard() {
      const imgElem = document.getElementById('fugitive-img');
      const rawImgUrl = fugitive.images && fugitive.images[0] ? (fugitive.images[0].original || fugitive.images[0].large || fugitive.images[0].thumb) : null;
      
      imgElem.style.opacity = '0';
      imgElem.src = getProxyImageUrl(rawImgUrl);
      imgElem.onload = () => { imgElem.style.opacity = '1'; };
      
      document.getElementById('fugitive-title').textContent = sanitizeText(fugitive.title);
      renderClues();
    }

    function handleImageError(img) {
      img.onerror = null;
      img.src = SILHOUETTE_SVG;
      img.style.opacity = '1';
    }

    function renderClues() {
      const container = document.getElementById('clues-list');
      container.innerHTML = '';

      const clues = [
        { label: 'Physical Attributes', text: `Hair: ${fugitive.hair_raw} | Eyes: ${fugitive.eyes_raw} | Sex: ${fugitive.sex}` },
        { label: 'Reward Info', text: fugitive.reward_text ? sanitizeText(fugitive.reward_text) : 'No specific bounty amount listed.' },
        { label: 'Field Office', text: fugitive.field_offices && fugitive.field_offices.length > 0 ? fugitive.field_offices.join(', ').toUpperCase() : 'General FBI Investigation' },
        { label: 'Associated Aliases', text: fugitive.aliases && fugitive.aliases.length > 0 ? sanitizeText(fugitive.aliases.slice(0, 3).join(', ')) : 'None registered' },
        { label: 'Redacted Summary', text: sanitizeSummary(fugitive.description) }
      ];

      for (let i = 0; i <= currentAttempt && i < clues.length; i++) {
        const div = document.createElement('div');
        div.className = 'clue-item';
        div.innerHTML = `<div class="clue-label">Clue ${i+1}: ${clues[i].label}</div><div>${clues[i].text}</div>`;
        container.appendChild(div);
      }
    }

    function sanitizeText(str) {
      if (!str) return '';
      let cleaned = str;
      CRIME_CATEGORIES.forEach(cat => {
        const words = cat.split(' ');
        words.forEach(w => {
          if (w.length > 3) {
            const reg = new RegExp(w, 'gi');
            cleaned = cleaned.replace(reg, '[REDACTED]');
          }
        });
      });
      return cleaned;
    }

    function sanitizeSummary(text) {
      let sanitized = sanitizeText(text);
      return sanitized.length > 180 ? sanitized.substring(0, 180) + '...' : sanitized;
    }

    function makeGuess() {
      if (userGuessed || currentAttempt >= MAX_ATTEMPTS) return;

      const select = document.getElementById('crime-select');
      const selectedGuess = select.value;

      if (!selectedGuess) {
        const container = document.getElementById('main-container');
        container.classList.add('shake');
        setTimeout(() => container.classList.remove('shake'), 400);
        return;
      }

      const dots = document.querySelectorAll('.dot');
      const actualSubjects = fugitive.subjects.map(s => s.toLowerCase());
      
      const isCorrect = actualSubjects.some(subj => 
        subj.includes(selectedGuess.toLowerCase()) || selectedGuess.toLowerCase().includes(subj)
      );

      if (isCorrect) {
        dots[currentAttempt].className = 'dot correct';
        endGame(true, false);
      } else {
        dots[currentAttempt].className = 'dot wrong';
        currentAttempt++;

        if (currentAttempt < MAX_ATTEMPTS) {
          dots[currentAttempt].className = 'dot current';
          renderClues();
        } else {
          endGame(false, false);
        }
      }

      if (activeMode === 'daily') {
        saveDailySession(isCorrect);
      }
    }

    function endGame(won, isReload = false) {
      userGuessed = true;
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('crime-select').disabled = true;

      if (!isReload) {
        updateStats(won);
      }

      const modal = document.getElementById('game-modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      const actionBtn = document.getElementById('modal-action-btn');

      title.textContent = won ? 'CASE SOLVED!' : 'SUSPECT ESCAPED!';
      title.style.color = won ? 'var(--correct)' : 'var(--wrong)';
      
      body.innerHTML = `
        <div style="margin-bottom: 8px;"><strong>Fugitive:</strong> ${fugitive.title}</div>
        <div><strong>Actual Category:</strong> ${fugitive.subjects.join(', ')}</div>
      `;

      if (activeMode === 'unlimited') {
        actionBtn.textContent = 'Play Next Case ➔';
      } else {
        actionBtn.textContent = 'Close Summary';
      }

      if (!isReload) {
        setTimeout(() => modal.classList.add('active'), 500);
      }
    }

    function handleModalAction() {
      closeModal();
      if (activeMode === 'unlimited') {
        startUnlimitedMode();
      }
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
    }

    function saveDailySession(won) {
      const sessionData = { attempt: currentAttempt, won: won, completed: true };
      localStorage.setItem(TODAY_KEY, JSON.stringify(sessionData));
    }

    function checkExistingDailySession() {
      const saved = localStorage.getItem(TODAY_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        currentAttempt = data.attempt;
        
        const dots = document.querySelectorAll('.dot');
        for (let i = 0; i < currentAttempt; i++) {
          dots[i].className = 'dot wrong';
        }

        if (data.completed) {
          if (data.won && dots[currentAttempt]) {
            dots[currentAttempt].className = 'dot correct';
          }
          endGame(data.won, true);
        }
      }
    }

    function updateStats(won) {
      if (activeMode === 'daily') {
        let stats = JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 };
        stats.played++;
        if (won) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
        localStorage.setItem('wantedle_stats', JSON.stringify(stats));
      } else {
        unlimitedStats.played++;
        if (won) { unlimitedStats.wins++; unlimitedStats.streak++; } else { unlimitedStats.streak = 0; }
      }
      updateStatsUI();
    }

    function updateStatsUI() {
      let stats = activeMode === 'daily' 
        ? (JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 })
        : unlimitedStats;

      document.getElementById('stat-played').textContent = stats.played;
      document.getElementById('stat-wins').textContent = stats.wins;
      document.getElementById('stat-streak').textContent = stats.streak;
    }

    function updateHomeStatsUI() {
      let stats = JSON.parse(localStorage.getItem('wantedle_stats')) || { played: 0, wins: 0, streak: 0 };
      document.getElementById('home-stat-played').textContent = stats.played;
      document.getElementById('home-stat-wins').textContent = stats.wins;
      document.getElementById('home-stat-streak').textContent = stats.streak;
    }

    // Initialize
    populateDropdown();
    updateHomeStatsUI();
  </script>
</body>
</html>
