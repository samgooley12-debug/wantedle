<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- GOOGLE SITE VERIFICATION -->
  <meta name="google-site-verification" content="letmCdiLn_MqCbGxy1eyQw1y0GfCWAhQ1H4WA7sw4_8" />

  <!-- SEO & OPEN GRAPH METADATA -->
  <title>Wantedle – Daily Criminal Category Guessing Game</title>
  <meta name="title" content="Wantedle – Daily Criminal Category Guessing Game" />
  <meta name="description" content="Test your crime-solving skills in Wantedle! Analyze mugshots and progressive evidence clues to guess the FBI wanted category or subject." />
  <meta name="keywords" content="wantedle, wantedle game, daily wordle games, crime guessing game, fbi wanted game, daily puzzle" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wantedle – Daily Case Guessing Game" />
  <meta property="og:description" content="Can you identify today's subject using progressive clues and evidence?" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border-color: #24324d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      color: var(--accent-color);
      text-transform: uppercase;
      font-weight: 900;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stats-bar span {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* SCREENS SETUP */
    .screen {
      display: none;
      width: 100%;
      max-width: 500px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HOME SCREEN UI */
    .home-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px 20px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .mode-btn {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.daily {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .mode-btn.unlimited {
      background-color: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
    }

    .mode-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    /* GAME UI */
    .game-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .image-box {
      width: 100%;
      height: 280px;
      background-color: #050811;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* NO BLUR - Fully sharp image */
      filter: none !important;
    }

    .clues-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .clue-item {
      background-color: #070c18;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-main);
    }

    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #070c18;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .action-btn {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }

    .attempts-tracker {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    .status-message.success { color: var(--success); }
    .status-message.error { color: var(--danger); }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      width: 100%;
    }

    .secondary-btn {
      flex: 1;
      padding: 10px;
      background-color: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>WANTEDLE</h1>
    <p class="subtitle">Daily Criminal Category Guessing Game</p>
    <div class="stats-bar">
      <div>Streak: <span id="streak-val">0</span></div>
      <div>Played: <span id="played-val">0</span></div>
    </div>
  </header>

  <!-- HOME SCREEN -->
  <div id="home-screen" class="screen active">
    <div class="home-card">
      <h2 style="margin-bottom: 10px;">Select Game Mode</h2>
      <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem;">
        Analyze profile clues and mugshots to identify the subject.
      </p>
      <button class="mode-btn daily" onclick="startGame('daily')">Play Daily Case</button>
      <button class="mode-btn unlimited" onclick="startGame('unlimited')">Play Unlimited Mode</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <main class="game-container">
      <div class="image-box">
        <img id="subject-img" src="" alt="Case Subject Image" />
      </div>

      <div class="clues-list" id="clues-container">
        <div class="clue-item" id="clue-1">Field Office: Loading...</div>
        <div class="clue-item" id="clue-2">Profile Note: Locked</div>
        <div class="clue-item" id="clue-3">Status / Details: Locked</div>
      </div>

      <div class="input-section" id="controls">
        <input type="text" id="guess-input" placeholder="Enter name or subject..." autocomplete="off" />
        <button id="submit-btn" class="action-btn" onclick="makeGuess()">Guess</button>
      </div>

      <div class="attempts-tracker" id="attempts">Attempts: 0 / 5</div>
      <div class="status-message" id="status"></div>

      <div class="nav-buttons">
        <button class="secondary-btn" onclick="showHomeScreen()">Home</button>
        <button id="next-btn" class="secondary-btn" style="display: none;" onclick="nextUnlimitedCase()">Next Case ➔</button>
      </div>
    </main>
  </div>

  <script>
    let currentMode = 'daily';
    let currentSubject = null;
    let allSubjects = [];
    let attempts = 0;
    const maxAttempts = 5;

    // Filter out giveaway keywords from clues
    function cleanText(text) {
      if (!text) return "Information withheld for investigation.";
      return text
        .replace(/violent\s*crimes?/gi, "Subject Profile")
        .replace(/crimes?/gi, "Incident")
        .replace(/fugitive/gi, "Individual")
        .replace(/wanted/gi, "Under Review")
        .replace(/bank\s*robbery/gi, "Financial Inquiry")
        .replace(/terrorism/gi, "Special Interest")
        .replace(/kidnapping/gi, "Location Inquiry")
        .replace(/murder/gi, "Critical Inquiry")
        .replace(/homicide/gi, "Major Incident")
        .replace(/deceased\s*individual/gi, "Subject Status Note")
        .trim();
    }

    function loadStats() {
      const streak = localStorage.getItem('wantedle_streak') || 0;
      const played = localStorage.getItem('wantedle_played') || 0;
      document.getElementById('streak-val').innerText = streak;
      document.getElementById('played-val').innerText = played;
    }

    function updateStats(won) {
      if (currentMode !== 'daily') return; // Stats only track for daily mode
      let streak = parseInt(localStorage.getItem('wantedle_streak') || 0);
      let played = parseInt(localStorage.getItem('wantedle_played') || 0);
      
      played++;
      streak = won ? streak + 1 : 0;

      localStorage.setItem('wantedle_streak', streak);
      localStorage.setItem('wantedle_played', played);
      
      document.getElementById('streak-val').innerText = streak;
      document.getElementById('played-val').innerText = played;
    }

    async function fetchSubjects() {
      if (allSubjects.length > 0) return allSubjects;
      try {
        const response = await fetch('https://api.fbi.gov/wanted/v1/list?page=1');
        const data = await response.json();
        allSubjects = data.items.filter(item => item.images && item.images.length > 0 && item.title);
        return allSubjects;
      } catch (err) {
        console.error("Failed to load subject data", err);
        return [];
      }
    }

    async function startGame(mode) {
      currentMode = mode;
      attempts = 0;
      
      document.getElementById('home-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('guess-input').disabled = false;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('status').innerText = '';
      document.getElementById('attempts').innerText = `Attempts: 0 / ${maxAttempts}`;

      const items = await fetchSubjects();
      if (!items.length) {
        document.getElementById('status').innerText = "Error loading cases. Please check your connection.";
        return;
      }

      if (mode === 'daily') {
        const today = new Date().toISOString().slice(0, 10);
        let hash = 0;
        for (let i = 0; i < today.length; i++) {
          hash = today.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % items.length;
        currentSubject = items[index];
      } else {
        // Unlimited Mode: Select random subject
        const randomIndex = Math.floor(Math.random() * items.length);
        currentSubject = items[randomIndex];
      }

      setupGameUI();
    }

    function setupGameUI() {
      // Set image (Sharp, no blur)
      const imgElement = document.getElementById('subject-img');
      imgElement.src = currentSubject.images[0].original || currentSubject.images[0].large;

      // Populate Cleaned Clues
      document.getElementById('clue-1').innerText = `Field Office: ${currentSubject.field_offices ? currentSubject.field_offices.join(', ') : 'Central Office'}`;
      document.getElementById('clue-2').innerText = `Profile Note: ${cleanText(currentSubject.description || currentSubject.subjects?.[0])}`;
      document.getElementById('clue-3').innerText = `Status / Details: ${cleanText(currentSubject.caution || currentSubject.details || 'Active File')}`;
    }

    function makeGuess() {
      const input = document.getElementById('guess-input');
      const userGuess = input.value.trim().toLowerCase();
      const status = document.getElementById('status');

      if (!userGuess || !currentSubject) return;

      attempts++;
      document.getElementById('attempts').innerText = `Attempts: ${attempts} / ${maxAttempts}`;

      const targetTitle = currentSubject.title.toLowerCase();

      if (targetTitle.includes(userGuess) || userGuess.includes(targetTitle)) {
        status.className = "status-message success";
        status.innerText = `Correct! Subject identified: ${currentSubject.title}`;
        updateStats(true);
        endGame();
      } else {
        if (attempts >= maxAttempts) {
          status.className = "status-message error";
          status.innerText = `Case Unsolved. Subject was: ${currentSubject.title}`;
          updateStats(false);
          endGame();
        } else {
          status.className = "status-message error";
          status.innerText = "Incorrect. Try again!";
        }
      }

      input.value = '';
    }

    function endGame() {
      document.getElementById('guess-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;
      if (currentMode === 'unlimited') {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function nextUnlimitedCase() {
      startGame('unlimited');
    }

    function showHomeScreen() {
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('home-screen').classList.add('active');
    }

    window.onload = function() {
      loadStats();
    };
  </script>
</body>
</html>
