<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUGITIVE DOSSIER // CRIME IDENTIFIER</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --bg: #05070a;
      --terminal-bg: #0c1017;
      --border: #1e293b;
      --border-glow: #00f0ff;
      --accent-amber: #ffb703;
      --accent-red: #ff003c;
      --text-bright: #f8fafc;
      --text-dim: #64748b;
      --correct: #00e676;
      --wrong: #ff003c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-bright);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      background-image: 
        radial-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 0),
        linear-gradient(to bottom, #05070a 0%, #020305 100%);
      background-size: 20px 20px, 100% 100%;
    }

    /* Tactical Header */
    header {
      width: 100%;
      max-width: 680px;
      border-bottom: 2px solid var(--accent-amber);
      padding-bottom: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .brand-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: #fff;
    }

    .brand-title span { color: var(--accent-amber); }

    .sys-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--correct);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sys-status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--correct);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--correct);
    }

    /* Main Console Container */
    .console-panel {
      width: 100%;
      max-width: 680px;
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    /* Terminal Scanlines Effect */
    .console-panel::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.6;
    }

    .console-header {
      background: #111622;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .screens-wrapper { padding: 20px; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Home Layout */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-terminal {
      background: #131a26;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 20px;
      cursor: pointer;
      text-align: left;
      font-family: 'Rajdhani', sans-serif;
      transition: all 0.2s;
    }

    .btn-terminal:hover {
      border-color: var(--accent-amber);
      background: #1a2333;
      transform: translateY(-2px);
    }

    .btn-terminal.primary {
      border-color: var(--accent-red);
      background: rgba(255, 0, 60, 0.08);
    }

    .btn-terminal.primary:hover {
      background: rgba(255, 0, 60, 0.15);
    }

    .btn-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-amber);
      margin-bottom: 6px;
    }

    .btn-desc { font-size: 0.85rem; color: var(--text-dim); }

    /* Gameplay Layout */
    .dossier-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .photo-frame {
      width: 200px;
      height: 250px;
      background: #000;
      border: 1px solid var(--border);
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(20%) contrast(110%);
    }

    .photo-stamp {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(0,0,0,0.8);
      color: var(--accent-red);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      text-align: center;
      padding: 2px;
      border: 1px solid var(--accent-red);
    }

    .clues-pane {
      background: #080a0f;
      border: 1px solid var(--border);
      padding: 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 250px;
      overflow-y: auto;
    }

    .clue-row {
      border-left: 2px solid var(--accent-amber);
      padding-left: 8px;
    }

    .clue-label {
      color: var(--text-dim);
      font-size: 0.65rem;
      text-transform: uppercase;
    }

    .clue-val {
      color: var(--text-bright);
      margin-top: 2px;
    }

    /* Input Matrix */
    .input-section {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    select {
      flex: 1;
      background: #080a0f;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      outline: none;
    }

    select:focus { border-color: var(--accent-amber); }

    .btn-submit {
      background: var(--accent-red);
      border: none;
      color: #fff;
      padding: 0 24px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .btn-submit:hover:not(:disabled) { background: #d00030; }
    .btn-submit:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Status Bar / Slots */
    .attempt-slots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .slot {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border);
      background: #080a0f;
    }

    .slot.wrong { background: var(--wrong); border-color: var(--wrong); }
    .slot.correct { background: var(--correct); border-color: var(--correct); }
    .slot.active { border-color: var(--accent-amber); box-shadow: 0 0 6px var(--accent-amber); }

    /* Dashboard Metrics */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      text-align: center;
    }

    .metric-cell {
      background: #080a0f;
      padding: 8px;
    }

    .metric-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      color: var(--accent-amber);
    }

    .metric-lbl {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* Loader Screen */
    .loader-box {
      text-align: center;
      padding: 60px 0;
      font-family: 'Share Tech Mono', monospace;
      color: var(--accent-amber);
    }

    /* Custom Alert Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .modal-panel {
      background: var(--terminal-bg);
      border: 1px solid var(--accent-amber);
      width: 90%;
      max-width: 420px;
      padding: 24px;
      font-family: 'Share Tech Mono', monospace;
    }

    .modal-header {
      font-size: 1.4rem;
      color: var(--accent-red);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .modal-content {
      background: #05070a;
      border: 1px solid var(--border);
      padding: 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .dossier-layout { grid-template-columns: 1fr; }
      .photo-frame { margin: 0 auto; }
      .menu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">CRIME<span>DEX</span></div>
    <div class="sys-status">ACTIVE WANTED DATABASE</div>
  </header>

  <div class="console-panel">
    <div class="console-header">
      <span>SECURE TERMINAL // V4.02</span>
      <span id="header-mode">STANDBY</span>
    </div>

    <div class="screens-wrapper">

      <!-- SCREEN 1: HOME MENU -->
      <div id="screen-home" class="screen active">
        <div class="menu-grid">
          <button class="btn-terminal primary" onclick="launchMode('daily')">
            <div class="btn-title">> DAILY DOSSIER</div>
            <div class="btn-desc">Analyze today's primary wanted criminal case.</div>
          </button>
          
          <button class="btn-terminal" onclick="launchMode('unlimited')">
            <div class="btn-title">> ARCHIVE STREAM</div>
            <div class="btn-desc">Continuous criminal file decryption mode.</div>
          </button>
        </div>

        <div class="metrics-bar">
          <div class="metric-cell"><div class="metric-val" id="h-played">0</div><div class="metric-lbl">Analyzed</div></div>
          <div class="metric-cell"><div class="metric-val" id="h-wins">0</div><div class="metric-lbl">Identified</div></div>
          <div class="metric-cell"><div class="metric-val" id="h-streak">0</div><div class="metric-lbl">Streak</div></div>
        </div>
      </div>

      <!-- SCREEN 2: LOADING -->
      <div id="screen-loader" class="screen loader-box">
        [ SYSTEM ] PARSING ACTIVE FBI WANTED ARCHIVES...
      </div>

      <!-- SCREEN 3: GAMEPLAY -->
      <div id="screen-game" class="screen">
        
        <div class="dossier-layout">
          <div class="photo-frame">
            <img id="suspect-img" src="" alt="Criminal Mugshot">
            <div class="photo-stamp">CLASSIFIED SUSPECT</div>
          </div>

          <div class="clues-pane" id="clues-box"></div>
        </div>

        <div class="input-section">
          <select id="crime-select">
            <option value="">-- SELECT CRIME CATEGORY --</option>
          </select>
          <button class="btn-submit" id="submit-btn" onclick="processGuess()">EXECUTE</button>
        </div>

        <div class="attempt-slots" id="slot-tracker">
          <div class="slot active"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>

        <div class="metrics-bar">
          <div class="metric-cell"><div class="metric-val" id="g-played">0</div><div class="metric-lbl">Cases</div></div>
          <div class="metric-cell"><div class="metric-val" id="g-wins">0</div><div class="metric-lbl">Solved</div></div>
          <div class="metric-cell"><div class="metric-val" id="g-streak">0</div><div class="metric-lbl">Streak</div></div>
        </div>

      </div>

    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-panel">
      <div class="modal-header" id="modal-title">ANALYSIS COMPLETE</div>
      <div class="modal-content" id="modal-body"></div>
      <button class="btn-submit" style="width: 100%; height: 40px;" onclick="closeModal()">CONTINUE</button>
    </div>
  </div>

  <script>
    const SILHOUETTE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="250" viewBox="0 0 200 250"><rect width="100%" height="100%" fill="%2305070a"/><path d="M100 50 a40 40 0 1 0 0.1 0 Z M50 210 c0-40 25-60 50-60 s50 20 50 60 Z" fill="%231e293b"/></svg>`;

    // Contingency backup pool (strict real living criminals)
    const CONTINGENCY_DATABASE = [
      {
        id: "ruja-ignatova",
        title: "Ruja Ignatova",
        thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/ruja-ignatova/@@images/image/thumb&w=200&h=250&fit=cover",
        subjects: ["White-Collar Crime", "Cyber's Most Wanted"],
        sex: "Female", hair: "Dark", eyes: "Brown", reward: "$5,000,000", office: "NEW YORK",
        summary: "Wanted for leadership in a global cryptocurrency fraud scheme (OneCoin)."
      },
      {
        id: "bhadreshkumar-patel",
        title: "Bhadreshkumar Chetanbhai Patel",
        thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/bhadreshkumar-chetanbhai-patel/@@images/image/thumb&w=200&h=250&fit=cover",
        subjects: ["Violent Crime - Murders"],
        sex: "Male", hair: "Brown", eyes: "Brown", reward: "$250,000", office: "BALTIMORE",
        summary: "Wanted for violent crime and murder inside a commercial store in Maryland."
      }
    ];

    let criminalDatabase = [];
    let activeCategories = new Set();
    let currentCase = null;
    let attemptCount = 0;
    const MAX_ATTEMPTS = 5;
    let currentMode = 'daily';
    let unlimitedStats = { played: 0, wins: 0, streak: 0 };

    async function fetchCleanCriminals() {
      if (criminalDatabase.length > 0) return;

      try {
        const response = await fetch('https://api.fbi.gov/wanted/v1/list?person_classification=main&pageSize=80');
        if (response.ok) {
          const data = await response.json();
          if (data.items) {
            criminalDatabase = parseAndFilter(data.items);
          }
        }
      } catch (err) {
        console.warn("FBI API query failed, activating local contingency data.", err);
      }

      if (criminalDatabase.length === 0) {
        criminalDatabase = CONTINGENCY_DATABASE;
      }

      // Collect only categories present in filtered criminals
      activeCategories.clear();
      criminalDatabase.forEach(c => c.subjects.forEach(s => activeCategories.add(s)));
      populateCategoryDropdown();
    }

    function parseAndFilter(items) {
      const EXCLUDE_TERMS = ['missing', 'kidnap', 'victim', 'deceased', 'captured', 'located', 'seeking info', 'endangered'];

      return items.filter(item => {
        if (!item.title || !item.subjects || item.subjects.length === 0) return false;

        const lowerSubjects = item.subjects.map(s => s.toLowerCase()).join(' ');
        const lowerDesc = (item.description || '').toLowerCase();
        const lowerCaution = (item.caution || '').toLowerCase();

        // Check if item contains any forbidden keywords (dead, victim, missing)
        const isForbidden = EXCLUDE_TERMS.some(term => 
          lowerSubjects.includes(term) || lowerDesc.includes(term) || lowerCaution.includes(term)
        );

        if (item.status && item.status.toLowerCase() !== 'na' && item.status.toLowerCase() !== 'active') {
          return false;
        }

        return !isForbidden;
      }).map(item => {
        let rawImg = null;
        if (item.images && item.images.length > 0) {
          rawImg = item.images[0].thumb || item.images[0].large || item.images[0].original;
        }

        const fastImg = rawImg 
          ? `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}&w=200&h=250&fit=cover` 
          : SILHOUETTE_SVG;

        return {
          id: item.uid || item.title,
          title: item.title,
          thumbUrl: fastImg,
          subjects: item.subjects,
          sex: item.sex || 'Unspecified',
          hair: item.hair_raw || item.hair || 'Unspecified',
          eyes: item.eyes_raw || item.eyes || 'Unspecified',
          reward: item.reward_text || 'No bounty recorded',
          office: item.field_offices ? item.field_offices.join(', ').toUpperCase() : 'FEDERAL HQ',
          summary: item.description || item.caution || 'Classified case file.'
        };
      });
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('crime-select');
      select.innerHTML = '<option value="">-- SELECT CRIME CATEGORY --</option>';
      
      Array.from(activeCategories).sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    async function launchMode(mode) {
      currentMode = mode;
      showScreen('screen-loader');
      document.getElementById('header-mode').textContent = mode.toUpperCase();

      await fetchCleanCriminals();

      if (mode === 'daily') {
        const seed = parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''), 10);
        currentCase = criminalDatabase[seed % criminalDatabase.length];
      } else {
        currentCase = criminalDatabase[Math.floor(Math.random() * criminalDatabase.length)];
      }

      setupGame();
    }

    function setupGame() {
      attemptCount = 0;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('crime-select').disabled = false;
      document.getElementById('crime-select').value = '';

      document.getElementById('suspect-img').src = currentCase.thumbUrl;

      resetSlots();
      renderClues();
      updateDashboardUI();
      showScreen('screen-game');
    }

    function renderClues() {
      const box = document.getElementById('clues-box');
      box.innerHTML = '';

      const clues = [
        { lbl: 'DEMOGRAPHICS', val: `SEX: ${currentCase.sex} | HAIR: ${currentCase.hair} | EYES: ${currentCase.eyes}` },
        { lbl: 'FIELD OFFICE', val: currentCase.office },
        { lbl: 'BOUNTY REWARD', val: redactSensitive(currentCase.reward) },
        { lbl: 'CASE OFFENSE', val: redactSensitive(currentCase.summary) }
      ];

      for (let i = 0; i <= attemptCount && i < clues.length; i++) {
        const div = document.createElement('div');
        div.className = 'clue-row';
        div.innerHTML = `
          <div class="clue-label">CLUE 0${i+1} // ${clues[i].lbl}</div>
          <div class="clue-val">${clues[i].val}</div>
        `;
        box.appendChild(div);
      }
    }

    function redactSensitive(str) {
      if (!str) return '';
      let out = str;
      activeCategories.forEach(cat => {
        cat.split(' ').forEach(w => {
          if (w.length > 3) {
            const reg = new RegExp(w, 'gi');
            out = out.replace(reg, '[REDACTED]');
          }
        });
      });
      return out.length > 150 ? out.substring(0, 150) + '...' : out;
    }

    function processGuess() {
      const select = document.getElementById('crime-select');
      const choice = select.value;
      if (!choice) return;

      const slots = document.querySelectorAll('.slot');
      const isCorrect = currentCase.subjects.includes(choice);

      if (isCorrect) {
        slots[attemptCount].className = 'slot correct';
        finishSession(true);
      } else {
        slots[attemptCount].className = 'slot wrong';
        attemptCount++;

        if (attemptCount < MAX_ATTEMPTS) {
          slots[attemptCount].className = 'slot active';
          renderClues();
        } else {
          finishSession(false);
        }
      }
    }

    function finishSession(won) {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('crime-select').disabled = true;

      saveMetrics(won);

      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      title.textContent = won ? 'FUGITIVE IDENTIFIED' : 'ANALYSIS FAILED';
      title.style.color = won ? 'var(--correct)' : 'var(--wrong)';

      body.innerHTML = `
        <strong>SUBJECT:</strong> ${currentCase.title}<br>
        <strong>PRIMARY CRIMES:</strong> ${currentCase.subjects.join(', ')}
      `;

      setTimeout(() => modal.classList.add('active'), 300);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (currentMode === 'unlimited') {
        launchMode('unlimited');
      } else {
        showScreen('screen-home');
      }
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function resetSlots() {
      const slots = document.querySelectorAll('.slot');
      slots.forEach((s, i) => s.className = i === 0 ? 'slot active' : 'slot');
    }

    function saveMetrics(won) {
      if (currentMode === 'daily') {
        let stats = JSON.parse(localStorage.getItem('crimedex_stats')) || { played: 0, wins: 0, streak: 0 };
        stats.played++;
        if (won) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
        localStorage.setItem('crimedex_stats', JSON.stringify(stats));
      } else {
        unlimitedStats.played++;
        if (won) { unlimitedStats.wins++; unlimitedStats.streak++; } else { unlimitedStats.streak = 0; }
      }
      updateDashboardUI();
    }

    function updateDashboardUI() {
      let stats = currentMode === 'daily'
        ? (JSON.parse(localStorage.getItem('crimedex_stats')) || { played: 0, wins: 0, streak: 0 })
        : unlimitedStats;

      document.getElementById('h-played').textContent = stats.played;
      document.getElementById('h-wins').textContent = stats.wins;
      document.getElementById('h-streak').textContent = stats.streak;

      document.getElementById('g-played').textContent = stats.played;
      document.getElementById('g-wins').textContent = stats.wins;
      document.getElementById('g-streak').textContent = stats.streak;
    }

    updateDashboardUI();
  </script>
</body>
</html>
