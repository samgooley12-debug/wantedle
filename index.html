<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIME FRAMED — Clue-Based Offense Identifier</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --border: #262933;
      --text: #f3f4f6;
      --muted: #8c95a6;
      --correct: #22c55e;
      --wrong: #ef4444;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* Framed Top Bar */
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .brand span { color: var(--accent); }

    .mode-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: #1e222d;
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Home Screen Buttons */
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-mode {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mode:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-mode.primary {
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
      border-color: var(--accent);
    }

    .btn-mode-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-mode-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Mugshot Stage */
    .image-stage {
      width: 100%;
      height: 280px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .image-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stage-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    /* Dynamic Clue Card */
    .clue-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .clue-header {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .clue-content {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Tracker Squares */
    .tracker-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .track-square {
      height: 10px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.2s ease;
    }

    .track-square.wrong { background: var(--wrong); }
    .track-square.correct { background: var(--correct); }
    .track-square.active { background: var(--accent); }

    /* Autocomplete Input Bar */
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .btn-submit:hover:not(:disabled) { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Dropdown Search Menu */
    .suggestions-menu {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: #1a1d26;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 50;
      margin-bottom: 6px;
      display: none;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }

    .suggestions-menu.active { display: block; }

    .sug-item {
      padding: 12px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sug-item:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Metrics Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-val { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    .loader {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .modal-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 12px; }
    .modal-body {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">CRIME<span>FRAMED</span></div>
    <div class="mode-badge" id="mode-badge">DAILY</div>
  </header>

  <div class="app-container">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="menu-stack">
        <button class="btn-mode primary" onclick="launchMode('daily')">
          <div class="btn-mode-title">🎯 Daily Fugitive</div>
          <div class="btn-mode-desc">Analyze progressive case evidence to identify today's primary offense.</div>
        </button>

        <button class="btn-mode" onclick="launchMode('unlimited')">
          <div class="btn-mode-title">♾️ Unlimited Mode</div>
          <div class="btn-mode-desc">Continuous archive stream with randomized criminal profiles.</div>
        </button>
      </div>

      <div class="stats-row">
        <div><div class="stat-val" id="h-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-val" id="h-wins">0</div><div class="stat-lbl">Solved</div></div>
        <div><div class="stat-val" id="h-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <!-- LOADER -->
    <div id="screen-loader" class="screen loader">
      Decrypting FBI Case Files & Structuring Evidence...
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">

      <div class="image-stage">
        <img id="suspect-img" src="" alt="Fugitive Mugshot">
        <div class="stage-overlay" id="attempt-indicator">CLUE 1/5</div>
      </div>

      <div class="clue-card">
        <div class="clue-header" id="clue-title">EVIDENCE FILE // CLUE 1</div>
        <div class="clue-content" id="clue-body">Loading forensic intelligence...</div>
      </div>

      <div class="tracker-bar">
        <div class="track-square active"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
        <div class="track-square"></div>
      </div>

      <div class="input-wrapper">
        <div class="suggestions-menu" id="suggestions"></div>
        <div class="search-bar">
          <input type="text" id="crime-input" placeholder="Search crime category..." autocomplete="off" oninput="handleSearchInput()">
          <button class="btn-submit" id="submit-btn" onclick="submitGuess()">SUBMIT</button>
        </div>
      </div>

      <div class="stats-row">
        <div><div class="stat-val" id="g-played">0</div><div class="stat-lbl">Played</div></div>
        <div><div class="stat-val" id="g-wins">0</div><div class="stat-lbl">Wins</div></div>
        <div><div class="stat-val" id="g-streak">0</div><div class="stat-lbl">Streak</div></div>
      </div>

    </div>

  </div>

  <!-- RESULT MODAL -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">ANALYSIS COMPLETE</div>
      <div class="modal-body" id="modal-body"></div>
      <button class="btn-submit" style="width: 100%; height: 44px;" onclick="closeModal()">CONTINUE</button>
    </div>
  </div>

  <script>
    const SILHOUETTE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="280" viewBox="0 0 300 280"><rect width="100%" height="100%" fill="%2316181e"/><path d="M150 60 a50 50 0 1 0 0.1 0 Z M80 250 c0-50 30-70 70-70 s70 20 70 70 Z" fill="%23262933"/></svg>`;

    const MASTER_CATEGORIES = [
      "Bank Robbers",
      "Counterintelligence",
      "Cyber's Most Wanted",
      "Criminal Enterprise Investigations",
      "Domestic Terrorism",
      "Human Trafficking",
      "Violent Crime - Murders",
      "White-Collar Crime",
      "Additional Violent Crimes",
      "Art Theft",
      "Carjacking / Auto Theft",
      "Civil Rights Violations",
      "Corporate / Securities Fraud",
      "Counterfeit Goods & Currency",
      "Drug Trafficking & Narcotics",
      "Ecological & Environmental Crimes",
      "Economic Espionage",
      "Extortion & Racketeering",
      "Financial Institution Fraud",
      "Healthcare Fraud",
      "Identity Theft",
      "Immigration / Passport Fraud",
      "Intellectual Property Theft",
      "International Terrorism",
      "Money Laundering",
      "Organized Crime",
      "Public Corruption",
      "Ransomware / Extortion",
      "Weapons Offenses & Arms Trafficking"
    ];

    let criminalPool = [];
    let activeCategorySet = new Set(MASTER_CATEGORIES);
    let currentCase = null;
    let attemptCount = 0;
    const MAX_ATTEMPTS = 5;
    let currentMode = 'daily';
    let unlimitedStats = { played: 0, wins: 0, streak: 0 };

    async function loadDatabase() {
      if (criminalPool.length > 0) return;

      try {
        const res = await fetch('https://api.fbi.gov/wanted/v1/list?person_classification=main&pageSize=100');
        if (res.ok) {
          const data = await res.json();
          if (data.items) {
            criminalPool = parseCriminals(data.items);
          }
        }
      } catch (e) {
        console.warn("Using fallback case files.", e);
      }

      if (criminalPool.length === 0) {
        criminalPool = [
          {
            id: "ruja-ignatova",
            title: "Ruja Ignatova",
            thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/ruja-ignatova/@@images/image/thumb&w=300&h=280&fit=cover",
            subjects: ["White-Collar Crime", "Cyber's Most Wanted"],
            bounty: "$5,000,000 USD",
            tactics: "Cryptocurrency Ponzi scheme, falsified financial logs, offshore shell entities",
            remarks: "Reported to travel with armed guards and forged passports",
            summary: "Wanted for leadership in a multi-billion dollar international fraud scheme (OneCoin)."
          },
          {
            id: "bhadreshkumar-patel",
            title: "Bhadreshkumar Chetanbhai Patel",
            thumbUrl: "https://images.weserv.nl/?url=www.fbi.gov/wanted/topten/bhadreshkumar-chetanbhai-patel/@@images/image/thumb&w=300&h=280&fit=cover",
            subjects: ["Violent Crime - Murders"],
            bounty: "$250,000 USD",
            tactics: "Edged weapon assault, flight to avoid prosecution",
            remarks: "Considered armed and extremely dangerous",
            summary: "Wanted for violent assault and murder inside a commercial establishment in Maryland."
          }
        ];
      }

      criminalPool.forEach(c => c.subjects.forEach(s => activeCategorySet.add(s)));
    }

    function parseCriminals(items) {
      const EXCLUDE = ['missing', 'kidnap', 'victim', 'deceased', 'captured', 'located', 'seeking info - missing'];

      return items.filter(item => {
        if (!item.title || !item.subjects || item.subjects.length === 0) return false;
        const subjStr = item.subjects.map(s => s.toLowerCase()).join(' ');
        const descStr = (item.description || '').toLowerCase();

        const isForbidden = EXCLUDE.some(term => subjStr.includes(term) || descStr.includes(term));
        if (item.status && item.status.toLowerCase() !== 'na' && item.status.toLowerCase() !== 'active') return false;

        return !isForbidden;
      }).map(item => {
        let rawImg = item.images && item.images.length > 0 ? (item.images[0].thumb || item.images[0].large) : null;
        const fastImg = rawImg ? `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}&w=300&h=280&fit=cover` : SILHOUETTE_SVG;

        return {
          id: item.uid || item.title,
          title: item.title,
          thumbUrl: fastImg,
          subjects: item.subjects,
          bounty: item.reward_text || 'No public bounty recorded',
          tactics: item.caution || item.remarks || 'Tactical profile classified',
          remarks: item.warning_message || 'Armed / Dangerous Status Active',
          summary: item.description || 'Restricted federal indictment record.'
        };
      });
    }

    async function launchMode(mode) {
      currentMode = mode;
      document.getElementById('mode-badge').textContent = mode.toUpperCase();
      showScreen('screen-loader');

      await loadDatabase();

      if (mode === 'daily') {
        const seed = parseInt(new Date().toISOString().slice(0,10).replace(/-/g, ''), 10);
        currentCase = criminalPool[seed % criminalPool.length];
      } else {
        currentCase = criminalPool[Math.floor(Math.random() * criminalPool.length)];
      }

      setupGame();
    }

    function setupGame() {
      attemptCount = 0;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('crime-input').disabled = false;
      document.getElementById('crime-input').value = '';

      document.getElementById('suspect-img').src = currentCase.thumbUrl;

      renderCurrentClue();
      updateTracker();
      updateStats();
      showScreen('screen-game');
    }

    function renderCurrentClue() {
      document.getElementById('attempt-indicator').textContent = `CLUE ${attemptCount + 1}/5`;

      const clues = [
        {
          title: "CLUE 01 // OPERATIONAL PROFILE & WARNINGS",
          body: `<strong>SECURITY STATUS:</strong> ${currentCase.remarks}<br><strong>ACTION PATTERN:</strong> ${redact(currentCase.tactics, 1)}`
        },
        {
          title: "CLUE 02 // BOUNTY & FINANCIAL IMPLICATIONS",
          body: `<strong>BOUNTY / REWARD:</strong> ${redact(currentCase.bounty, 1)}<br><strong>TARGET TYPE:</strong> High-impact illegal activity targeting federal or civil systems.`
        },
        {
          title: "CLUE 03 // CASE SUMMARY (PARTIAL REDACTION)",
          body: `<strong>STATEMENT:</strong> ${redact(currentCase.summary, 2)}`
        },
        {
          title: "CLUE 04 // FORENSIC MODUS OPERANDI",
          body: `<strong>METHODOLOGY:</strong> ${currentCase.summary.length > 80 ? currentCase.summary.substring(0, 80) + '... [REDACTED DETAILS]' : currentCase.summary}`
        },
        {
          title: "CLUE 05 // UNREDACTED PRESS BRIEF",
          body: `<strong>FULL SUMMARY:</strong> ${currentCase.summary}`
        }
      ];

      document.getElementById('clue-title').textContent = clues[attemptCount].title;
      document.getElementById('clue-body').innerHTML = clues[attemptCount].body;
    }

    function redact(text, intensity = 1) {
      if (!text) return 'No details available.';
      let out = text;

      // Mask primary crime category words to prevent immediate spoil
      activeCategorySet.forEach(cat => {
        cat.split(' ').forEach(w => {
          if (w.length > 3) {
            const reg = new RegExp(w, 'gi');
            out = out.replace(reg, '████');
          }
        });
      });

      if (intensity > 1) {
        out = out.replace(/\b(money|stolen|murder|weapon|bank|wire|fraud|cyber|drug|terrorism|victim)\b/gi, '████');
      }

      return out;
    }

    function handleSearchInput() {
      const query = document.getElementById('crime-input').value.toLowerCase().trim();
      const menu = document.getElementById('suggestions');
      menu.innerHTML = '';

      if (!query) {
        menu.classList.remove('active');
        return;
      }

      const matches = Array.from(activeCategorySet).filter(c => c.toLowerCase().includes(query));

      if (matches.length > 0) {
        matches.forEach(m => {
          const item = document.createElement('div');
          item.className = 'sug-item';
          item.textContent = m;
          item.onclick = () => {
            document.getElementById('crime-input').value = m;
            menu.classList.remove('active');
          };
          menu.appendChild(item);
        });
        menu.classList.add('active');
      } else {
        menu.classList.remove('active');
      }
    }

    function submitGuess() {
      const input = document.getElementById('crime-input');
      const guess = input.value.trim();
      if (!guess) return;

      document.getElementById('suggestions').classList.remove('active');

      const guessNorm = guess.toLowerCase();
      const isCorrect = currentCase.subjects.some(s => {
        const sNorm = s.toLowerCase();
        return sNorm === guessNorm || sNorm.includes(guessNorm) || guessNorm.includes(sNorm);
      });

      const squares = document.querySelectorAll('.track-square');

      if (isCorrect) {
        squares[attemptCount].className = 'track-square correct';
        endGame(true);
      } else {
        squares[attemptCount].className = 'track-square wrong';
        attemptCount++;

        if (attemptCount < MAX_ATTEMPTS) {
          squares[attemptCount].className = 'track-square active';
          renderCurrentClue();
          input.value = '';
        } else {
          endGame(false);
        }
      }
    }

    function endGame(won) {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('crime-input').disabled = true;

      saveMetrics(won);

      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      title.textContent = won ? 'IDENTIFICATION SUCCESSFUL' : 'ANALYSIS FAILED';
      title.style.color = won ? 'var(--correct)' : 'var(--wrong)';

      body.innerHTML = `
        <strong>Fugitive:</strong> ${currentCase.title}<br>
        <strong>Primary Category:</strong> ${currentCase.subjects.join(', ')}
      `;

      setTimeout(() => modal.classList.add('active'), 300);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (currentMode === 'unlimited') {
        launchMode('unlimited');
      } else {
        showScreen('screen-home');
      }
    }

    function updateTracker() {
      const squares = document.querySelectorAll('.track-square');
      squares.forEach((sq, i) => sq.className = i === 0 ? 'track-square active' : 'track-square');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function saveMetrics(won) {
      if (currentMode === 'daily') {
        let stats = JSON.parse(localStorage.getItem('framed_crime_stats')) || { played: 0, wins: 0, streak: 0 };
        stats.played++;
        if (won) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
        localStorage.setItem('framed_crime_stats', JSON.stringify(stats));
      } else {
        unlimitedStats.played++;
        if (won) { unlimitedStats.wins++; unlimitedStats.streak++; } else { unlimitedStats.streak = 0; }
      }
      updateStats();
    }

    function updateStats() {
      let stats = currentMode === 'daily'
        ? (JSON.parse(localStorage.getItem('framed_crime_stats')) || { played: 0, wins: 0, streak: 0 })
        : unlimitedStats;

      document.getElementById('h-played').textContent = stats.played;
      document.getElementById('h-wins').textContent = stats.wins;
      document.getElementById('h-streak').textContent = stats.streak;

      document.getElementById('g-played').textContent = stats.played;
      document.getElementById('g-wins').textContent = stats.wins;
      document.getElementById('g-streak').textContent = stats.streak;
    }

    updateStats();
  </script>
</body>
</html>
